openapi: 3.2.0
info:
  description: 'This is the API reference for incident.io. It documents available API endpoints, provides examples of how to use it, and

    instructions around things like authentication and error handling. The API is hosted at:


    - https://api.incident.io/


    And you will need to create an API key via your incident.io

    dashboard to make requests. # Making requests


    Here are the key concepts required to make requests to the incident.io API. ## Authentication


    For all requests made to the incident.io API, you''ll need an API key. To create an API key, head to the incident dashboard and visit API

    keys. When you create the key, you''ll be able to choose what actions it

    can take for your account: choose carefully, as those roles can only be set

    when you first create the key. We''ll only show you the token once, so make sure

    you store it somewhere safe. API keys are global to your incident.io account, and can be managed by anyone

    who has the right permissions. We display the user that created the API key,

    and the API key will remain valid if that user becomes deactivated. Once you have the key, you should make requests to the API that set the

    `Authorization` request header using a "Bearer" authentication scheme:


    ```

    Authorization: Bearer

    ```


    ## Rate Limits


    The incident.io API enforces rate limits to ensure consistent performance for all users. The default rate limit is 1200 requests/minute per API key. This limit applies to most endpoints across the API. Limits are token buckets that refill continuously rather than resetting on a fixed window boundary. The default

    bucket holds 1200 requests and refills at 20 per second, so you can burst up to the full bucket and then sustain

    20 requests/second indefinitely. There is no boundary at which your quota resets to full in one step. Some endpoints have lower rate limits, particularly those that interact with external third-party systems that impose

    their own limitations. These specific limits vary by endpoint. ### Rate limit headers


    Responses to requests authenticated with an API key carry your current allowance, so you can pace yourself rather

    than waiting to be throttled:


    ```

    X-RateLimit-Limit: 60, 1200;window=60, 60;window=60

    X-RateLimit-Remaining: 59

    X-RateLimit-Used: 1

    X-RateLimit-Reset: 1785173199

    ```


    | Header | Meaning |

    | --- | --- |

    | `X-RateLimit-Limit` | The quota that binds this request, followed by every limit that applied and the window it applies over |

    | `X-RateLimit-Remaining` | Requests you can make right now against the binding limit |

    | `X-RateLimit-Used` | Requests you have spent against it |

    | `X-RateLimit-Reset` | Unix timestamp (seconds) at which that limit will be back to full |


    More than one limit can apply to a request: your API key''s overall limit, and for some endpoints a lower limit of

    their own. `X-RateLimit-Limit` lists all of them, each with its window, so `1200;window=60` means 1200 requests per

    minute. Because our limits refill continuously rather than resetting on a boundary, that window is what tells you

    the rate you can sustain: 1200 per 60 seconds is 20 requests/second indefinitely. `Remaining`, `Used` and `Reset` describe whichever limit has the least allowance left, since that is the one you

    will hit first. `X-RateLimit-Remaining` may lag by a small number of requests under high concurrency, and can move by more than the

    requests you made, because limits scoped to your whole organisation are shared with your other API keys. Headers are omitted rather than guessed if we cannot determine your allowance for a request. ### Exceeding a rate limit


    When you exceed a rate limit the API responds with `429 Too Many Requests` and a `Retry-After` header giving the

    number of seconds to wait:


    ```

    X-RateLimit-Limit: 1200, 1200;window=60

    X-RateLimit-Remaining: 0

    X-RateLimit-Used: 1200

    X-RateLimit-Reset: 1785173199

    Retry-After: 1

    ```


    Prefer `Retry-After` over `X-RateLimit-Reset` when deciding how long to back off.'
  title: incident.io Incident Timeline Items V2 API
  version: 1.0.0
servers:
- url: https://api.incident.io
security:
- BearerAuth: []
tags:
- description: 'Read and write the items on an incident''s timeline.


    The timeline is the curated narrative of an incident: the handful of moments that explain what

    happened, rather than the activity log, which records everything that did. Items are either

    promoted or custom. Promoted items are activity lifted onto the timeline - a pinned message,

    an escalation, an incident update, an event added by a workflow - and carry the ID of the

    activity log entry they came from. Custom items are written by hand, in the dashboard or

    through this API, and have no activity_log_id.


    Use this to pull an incident''s narrative into your own systems - a retrospective template, a

    report, a record you keep outside incident.io - and to put the things you know about back on

    it, like a deploy, a config change or a load test you halted.'
  name: Incident Timeline Items V2
paths:
  /v2/incident_timeline_items:
    get:
      description: 'List the timeline items for an incident, oldest first.


        Items are ordered by timestamp, then by ID to break ties, which is the order the dashboard

        shows them in. If the incident has streams, this returns the items on its streams too -

        they''re part of the same narrative - and incident_id on each item tells you which stream it

        came from.


        Items can be edited after they''re written, and this endpoint always returns their current

        state, so listing an incident again gives you the timeline as it stands today.'
      operationId: IncidentTimelineItemsV2#List
      parameters:
      - allowEmptyValue: true
        description: Incident whose timeline you want to list
        example: 01G0J1EXE7AXZ2C93K61WBPYEH
        in: query
        name: incident_id
        required: true
        schema:
          example: 01FCNDV6P870EA6S7TK1DSYD5H
          type: string
      - allowEmptyValue: true
        description: Integer number of records to return
        example: 25
        in: query
        name: page_size
        schema:
          default: 25
          description: Integer number of records to return
          example: 25
          format: int64
          maximum: 250
          minimum: 1
          type: integer
      - allowEmptyValue: true
        description: A timeline item's ID. This endpoint returns the items that follow it.
        examples:
          default:
            summary: default
            value: 01FCNDV6P870EA6S7TK1DSYDG0
        in: query
        name: after
        schema:
          description: A timeline item's ID. This endpoint returns the items that follow it.
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                incident_timeline_items:
                - activity_log_id: 01FCNDV6P870EA6S7TK1DSYDG1
                  created_at: '2026-09-01T15:31:04Z'
                  creator:
                    alert:
                      id: 01GW2G3V0S59R238FAHPDS1R66
                      title: '*errors.withMessage: PG::Error failed to connect'
                    api_key:
                      id: 01FCNDV6P870EA6S7TK1DSYDG0
                      name: My test API key
                    user:
                      email: lisa@incident.io
                      id: 01FCNDV6P870EA6S7TK1DSYDG0
                      name: Lisa Karlin Curtis
                      role: owner
                      slack_user_id: U02AYNF2XJM
                    workflow:
                      id: 01FCNDV6P870EA6S7TK1DSYDG0
                      name: My little workflow
                  description: Rolled back **payments-api** to v411 after error rate hit 12%.
                  id: 01FCNDV6P870EA6S7TK1DSYDG0
                  incident_id: 01G0J1EXE7AXZ2C93K61WBPYEH
                  timestamp: '2026-09-01T15:30:00Z'
                  title: Rolled back payments-api
                  updated_at: '2026-09-01T16:45:00Z'
                pagination_meta:
                  after: 01FCNDV6P870EA6S7TK1DSYDG0
                  page_size: 25
              schema:
                $ref: '#/components/schemas/IncidentTimelineItemsListResultV2'
          description: OK response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'invalid_request_error: There was a problem with the request, like a missing header or querying a resource that doesn''t exist.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'authentication_error: Authentication failed.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'resource_forbidden: Access to this resource is forbidden for the authenticated user.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'not_found: The referenced resource could not be found.'

      summary: List Incident Timeline Items V2
      tags:
      - Incident Timeline Items V2
      x-docs-display-name: List
      x-docs-group-name: Incident Timeline Items V2
      x-docs-resource-type: IncidentTimelineItemV2
      x-mint:
        content: 🔑 Requires the `incidents.view` scope.
      x-rbac-scopes:
      - incidents.view
      x-operation-id-source: normalized
      x-operation-id-original: Incident Timeline Items V2#List
    post:
      description: 'Add a custom item to an incident''s timeline.


        Items created here are custom, so they carry no activity_log_id and their timestamp stays

        editable. Set it to when the thing actually happened rather than when you''re telling us about

        it - a deploy you shipped an hour ago belongs an hour back on the timeline.


        Every request needs an idempotency_key. Retrying with a key we''ve already seen returns the

        item the first request created rather than writing a second one, so an automation that

        retries on a timeout doesn''t leave a duplicate behind.'
      operationId: IncidentTimelineItemsV2#Create
      requestBody:
        content:
          application/json:
            example:
              description: Rolled back **payments-api** to v411 after error rate hit 12%.
              idempotency_key: deploy-4f2c1b90
              incident_id: 01FCNDV6P870EA6S7TK1DSYD5H
              timestamp: '2026-09-01T15:30:00Z'
              title: Rolled back payments-api
            schema:
              $ref: '#/components/schemas/IncidentTimelineItemsCreatePayloadV2'
        required: true

  /v2/status_pages/{status_page_id}/components/{component_id}/availability:
    get:
      description: 'Show availability for a status page component over a time window.


        Pass start_at and end_at as RFC3339 timestamps. The window cannot be longer than 366 days. Availability uses the same rules as the public status page: full and partial outages count as downtime, overlapping impacts are merged, and time before we have data for the component is excluded rather than counted as up.


        This endpoint requires a valid API key but no specific scopes. Use ListStatusPages and ShowStatusPageStructure to find status page and component IDs.'
      operationId: StatusPagesV2#ShowStatusPageComponentAvailability
      parameters:
      - allowEmptyValue: true
        description: Start of the availability window
        example: '2026-01-01T00:00:00Z'
        in: query
        name: start_at
        required: true
        schema:
          description: Start of the availability window
          example: '2026-01-01T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: true
        description: End of the availability window
        example: '2026-02-01T00:00:00Z'
        in: query
        name: end_at
        required: true
        schema:
          description: End of the availability window
          example: '2026-02-01T00:00:00Z'
          format: date-time
          type: string
      - description: ID of the status page. You can find this by calling the ListStatusPages endpoint.

        required: true
        schema:
          description: ID of the status page. You can find this by calling the ListStatusPages endpoint.
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
      - description: ID of the component. You can find this by calling the ShowStatusPageStructure endpoint.

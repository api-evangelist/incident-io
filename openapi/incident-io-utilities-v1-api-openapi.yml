  version: 1.0.0
servers:
- url: https://api.incident.io
security:
- BearerAuth: []
tags:
- description: 'Miscelaneous utility endpoints.


    Collection of utility functions that can help build integrations against this API.'
  name: Utilities V1
paths:
  /v1/identity:
    get:
      description: Test if your API key is valid, and which roles it has.
      operationId: UtilitiesV1#Identity
      responses:
        '200':
          content:
            application/json:
              example:
                identity:
                  dashboard_url: https://app.incident.io/my-org
                  name: Alertmanager token
                  roles:
                  - viewer
                  team_roles:
                  - catalog_editor
                  teams:
                  - id: 01G0J1EXE7AXZ2C93K61WBPYEH
                    name: Platform
              schema:
                $ref: '#/components/schemas/UtilitiesIdentityResultV1'
          description: OK response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'invalid_request_error: There was a problem with the request, like a missing header or querying a resource that doesn''t exist.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'authentication_error: Authentication failed.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'resource_forbidden: Access to this resource is forbidden for the authenticated user.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'not_found: The referenced resource could not be found.'
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'method_not_allowed: The endpoint does not support this operation for the specified resource.'
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'not_acceptable: Requested a media type this endpoint does not support.'
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'request_timeout: The request took too long to process.


            client_timeout: The request was cancelled by the client.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'conflict: Request conflicted with current state of the resource, likely a concurrent update.'
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'precondition_failed: A required condition hasn''t been met.'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'payload_too_large: The request payload is too large.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'validation_error: A required field was not provided, or the provided data was invalid.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'too_many_requests: Too many requests hit the API too quickly. We recommend an exponential backoff of your requests.


            rate_limit_reached: The rate limit associated with this resource or API key has been exceeded. Try again later.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'api_error: Something went wrong and has been reported internally.'
      summary: Identity Utilities V1
      tags:
      - Utilities V1
      x-docs-display-name: Show Identity
      x-docs-group-name: Utilities V1
      x-operation-id-source: normalized
      x-operation-id-original: Utilities V1#Identity
  /v1/ip_ranges:
    get:
      description: 'List the IP addresses our requests to your systems come from.


        Use this to keep a firewall allowlist up to date without watching our documentation. Poll

        it rather than copying the list once. We give at least two weeks'' notice before our own

        addresses change. Webhook deliveries come from our provider''s addresses, so we cannot

        promise notice on those.


        These are the addresses we send from. Do not allowlist them for inbound access: our API is

        served on different addresses, and those change without notice.'
      operationId: UtilitiesV1#IPRanges
      responses:
        '200':
          content:
            application/json:
              example:
                ip_ranges:
                - cidr: 34.91.219.113/32
                  description: Requests to your systems from integrations and from workflow "Send a webhook" steps
              schema:
                $ref: '#/components/schemas/UtilitiesIPRangesResultV1'
          description: OK response.
        '400':
          content:

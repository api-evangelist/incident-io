servers:
- url: https://api.incident.io
security:
- BearerAuth: []
tags:
- description: 'Create and manage escalation paths, and create, list, filter and respond to escalations.


    With incident.io On-call you can create escalation paths that describe how a page should

    be escalated to people and schedules.'
  name: Escalations V2

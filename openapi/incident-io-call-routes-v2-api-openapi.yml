    CallRouteV2:
      description: 'A call route is a phone number your customers can call to reach whoever is

        on call, for an urgent support line or a regulator hotline.


        When a call comes in we work down the route''s path, ringing each level''s targets

        in turn until someone answers, then connect them to the caller. A trailing

        voicemail node records a message instead. Every call raises an alert, so calls

        can open incidents through an alert route.


        List and edit call routes here. Create and delete them in the dashboard.'
      example:
        allowed_callers:
        - id: 01FCNDV6P870EA6S7TK1DSYDG0
          name: Regulator duty desk
          phone_number: '+15551234567'
        country_code: US
        created_at: '2021-08-17T13:28:57.801578Z'
        current_state: active
        custom_language: en-US
        id: 01FCNDV6P870EA6S7TK1DSYDG0
        name: Regulator urgent request
        options:
        - digit: '1'
          id: 01FCNDV6P870EA6S7TK1DSYDG0
          path:
          - id: 01FCNDV6P870EA6S7TK1DSYDG0
            level:
              targets:
              - id: lawrencejones
                schedule_mode: currently_on_call
                selected_rota_id: 01FCNDV6P870EA6S7TK1DSYDG0
                type: schedule
                urgency: high
            type: level
            voicemail:
              greeting_text: Sorry, no one is available to take your call. Please leave a message after the tone. This call will be recorded.
          prompt: For an urgent production outage, press 1
        path:
        - id: 01FCNDV6P870EA6S7TK1DSYDG0
          level:
            targets:
            - id: lawrencejones
              schedule_mode: currently_on_call
              selected_rota_id: 01FCNDV6P870EA6S7TK1DSYDG0
              type: schedule
              urgency: high
          type: level
          voicemail:
            greeting_text: Sorry, no one is available to take your call. Please leave a message after the tone. This call will be recorded.
        phone_number: '+15551234567'
        phone_number_type: toll_free
        responder_caller_id: route_number
        updated_at: '2021-08-17T13:28:57.801578Z'
        use_caller_allowlist: true
      properties:
        allowed_callers:
          description: The numbers allowed to call this route. Only enforced when use_caller_allowlist is true.
          example:
          - id: 01FCNDV6P870EA6S7TK1DSYDG0
            name: Regulator duty desk
            phone_number: '+15551234567'
          items:
            $ref: '#/components/schemas/CallRouteAllowedCallerV2'
          type: array
        country_code:
          description: The country this route's number belongs to
          example: US
          type: string
        created_at:
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        current_state:
          description: 'Where this route is in provisioning. Only an active route answers calls:

            * pending: created, and awaiting manual work from us

            * pending_regulatory_information: awaiting regulatory compliance information, collected in the dashboard

            * pending_number: compliance is settled, and we''re provisioning a number

            * active: fully provisioned, and answering calls'
          enum:
          - pending
          - pending_regulatory_information
          - pending_number
          - active
          example: active
          type: string
        custom_language:
          description: The language we speak voice prompts in, via text-to-speech
          enum:
          - en-US
          - en-GB
          - fr-FR
          - es-ES
          - pt-PT
          - pt-BR
          - de-DE
          - nl-NL
          example: en-US
          type: string
        id:
          description: Unique identifier for this call route
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
        name:
          description: Name for this call route
          example: Regulator urgent request
          type: string
        options:
          description: The phone-tree menu this route presents. Empty when callers are routed down the route's path.
          example:
          - digit: '1'
            id: 01FCNDV6P870EA6S7TK1DSYDG0
            path:
            - id: 01FCNDV6P870EA6S7TK1DSYDG0
              level:
                targets:
                - id: lawrencejones
                  schedule_mode: currently_on_call
                  selected_rota_id: 01FCNDV6P870EA6S7TK1DSYDG0
                  type: schedule
                  urgency: high
              type: level
              voicemail:
                greeting_text: Sorry, no one is available to take your call. Please leave a message after the tone. This call will be recorded.
            prompt: For an urgent production outage, press 1
          items:
            $ref: '#/components/schemas/CallRouteOptionV2'
          type: array
        path:
          description: Who we page when a call comes in. Empty when this route presents a phone-tree menu, in which case each menu option carries its own path.
          example:
          - id: 01FCNDV6P870EA6S7TK1DSYDG0
            level:
              targets:
              - id: lawrencejones
                schedule_mode: currently_on_call
                selected_rota_id: 01FCNDV6P870EA6S7TK1DSYDG0
                type: schedule
                urgency: high
            type: level
            voicemail:
              greeting_text: Sorry, no one is available to take your call. Please leave a message after the tone. This call will be recorded.
          items:
            $ref: '#/components/schemas/CallRoutePathNodeV2'
          type: array
        phone_number:
          description: The number your customers call to reach this route, once one has been provisioned
          example: '+15551234567'
          type: string
        phone_number_type:
          description: The type of phone number, which determines the regulatory requirements for provisioning it
          enum:
          - toll_free
          - mobile
          - national
          - local
          example: toll_free
          type: string
          x-public-api-version: v2
        responder_caller_id:
          description: 'Which number responders see when we call them:

            * route_number: this route''s own number

            * oncall_number: an incident.io on-call number'
          enum:
          - route_number
          - oncall_number
          example: route_number
          type: string
        updated_at:
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        use_caller_allowlist:
          description: Whether this route only answers calls from its allowed callers
          example: true
          type: boolean

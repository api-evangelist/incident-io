      example:
        alert_attributes:
        - array: false
          emoji: fire
          id: 01GW2G3V0S59R238FAHPDS1R66
          name: service
          required: false
          type: CatalogEntry["01GW2G3V0S59R238FAHPDS1R67"]
      properties:

paths:
  /v1/api_keys:
    get:
      description: 'List API keys visible to the calling API key, with pagination. An API key with account-level `api_keys_manage` access will see all keys, while a key with the `api_keys_manage` role scoped to specific teams will only see keys belonging to those teams.


        This endpoint requires a valid API key with the `api_keys_manage` role at either the account level or team level.'
      operationId: APIKeysV1#List
      parameters:
      - allowEmptyValue: true
        description: Integer number of records to return
        example: 25
        in: query
        name: page_size
        schema:
          default: 25
          description: Integer number of records to return
          example: 25
          format: int64
          maximum: 250
          minimum: 1
          type: integer
      - allowEmptyValue: true
        description: An record's ID. This endpoint will return a list of records after this ID in relation to the API response order.
        example: 01FDAG4SAP5TYPT98WGR2N7W91
        in: query
        name: after
        schema:
          description: An record's ID. This endpoint will return a list of records after this ID in relation to the API response order.
          example: 01FDAG4SAP5TYPT98WGR2N7W91
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                api_keys:
                - comments: Requested in https://example.slack.com/archives/C123/p456
                  created_at: '2021-08-17T13:28:57.801578Z'
                  creator:
                    api_key:
                      id: 01FCNDV6P870EA6S7TK1DSYDG0
                      name: My test API key
                    user:
                      email: lisa@incident.io
                      id: 01FCNDV6P870EA6S7TK1DSYDG0
                      name: Lisa Karlin Curtis
                      role: viewer
                      slack_user_id: U02AYNF2XJM
                  id: 01FCNDV6P870EA6S7TK1DSYDG0
                  last_used_at: '2021-08-17T13:28:57.801578Z'
                  name: My test API key
                  roles:
                  - description: can view data, like public incidents and organization settings
                    name: viewer
                  team_ids:

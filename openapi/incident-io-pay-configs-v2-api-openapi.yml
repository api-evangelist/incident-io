components:
  schemas:
    PayConfigsCreatePayloadV2:
      example:
        base_rate_cents: 1200
        currency: GBP
        name: Engineering on-call
        one_off_rules:
        - end_at: '2021-08-17T13:28:57.801578Z'
          id: 01G0J1EXE7AXZ2C93K61WBPYEH
          name: Christmas day
          rate_cents: 4800
          start_at: '2021-08-17T13:28:57.801578Z'
        rate_time_unit: hour
        timezone: Europe/London
        weekly_rules:
        - end_time: '17:00'
          id: 01G0J1EXE7AXZ2C93K61WBPYEH
          rate_cents: 2400
          start_time: 09:00
          weekdays:
          - monday
      properties:
        base_rate_cents:
          description: Rate paid for any time no rule covers, in the lowest denomination of the currency
          example: 1200
          format: int64
          type: integer
        currency:
          description: Currency this config pays in, in ISO 4217 format
          example: GBP
          type: string
        name:
          description: Human readable name for this pay config
          example: Engineering on-call
          type: string
        one_off_rules:
          description: Rules that apply over a single window of time
          example:
          - end_at: '2021-08-17T13:28:57.801578Z'
            id: 01G0J1EXE7AXZ2C93K61WBPYEH
            name: Christmas day
            rate_cents: 4800
            start_at: '2021-08-17T13:28:57.801578Z'
          items:
            $ref: '#/components/schemas/PayConfigOneOffRulePayloadV2'
          type: array
        rate_time_unit:
          description: The unit of time every rate on this config is quoted per
          enum:
          - hour
          - day
          example: hour
          type: string
        timezone:
          description: IANA timezone this config's rules are interpreted in
          example: Europe/London
          type: string
        weekly_rules:
          description: Rules that apply every week, in the order they should be evaluated
          example:
          - end_time: '17:00'
            id: 01G0J1EXE7AXZ2C93K61WBPYEH
            rate_cents: 2400
            start_time: 09:00
            weekdays:
            - monday
          items:
            $ref: '#/components/schemas/PayConfigWeeklyRulePayloadV2'
          type: array
      required:
      - name
      - timezone
      - currency
      - base_rate_cents
      - rate_time_unit
      type: object
    PayConfigsUpdatePayloadV2:
      example:
        base_rate_cents: 1200
        currency: GBP
        name: Engineering on-call
        rate_time_unit: hour
        timezone: Europe/London
      properties:
        base_rate_cents:
          description: Rate paid for any time no rule covers, in the lowest denomination of the currency
          example: 1200
          format: int64
          type: integer
        currency:
          description: Currency this config pays in, in ISO 4217 format
          example: GBP
          type: string
        name:
          description: Human readable name for this pay config
          example: Engineering on-call
          type: string
        rate_time_unit:
          description: The unit of time every rate on this config is quoted per. Pay is pro-rated by the second either way.
          enum:
          - hour
          - day
          example: hour
          type: string
        timezone:
          description: IANA timezone this config's rules are interpreted in
          example: Europe/London
          type: string
      required:
      - name
      - timezone
      - currency
      - base_rate_cents
      - rate_time_unit
      type: object
    PayConfigsListOneOffRulesResultV2:
      example:
        one_off_rules:
        - end_at: '2021-08-17T13:28:57.801578Z'

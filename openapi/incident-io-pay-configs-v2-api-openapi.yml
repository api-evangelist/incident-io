servers:
- url: https://api.incident.io
security:
- BearerAuth: []
tags:
- description: 'Manage on-call pay configs: the rates that pay reports price on-call shifts against.'
  name: Pay Configs V2
paths:
  /v2/pay_configs:
    get:
      description: 'List pay configs for this organisation.


        Returns published configs, and drafts created through the API, which belong to

        nobody and so are visible to everyone. A draft a person created in the

        dashboard stays private to them. Archived configs are never returned.'
      operationId: PayConfigsV2#List
      parameters:
      - allowEmptyValue: true
        description: Integer number of records to return
        example: 25
        in: query
        name: page_size
        schema:
          default: 25
          description: Integer number of records to return
          example: 25
          format: int64
          maximum: 250
          minimum: 1
          type: integer
      - allowEmptyValue: true
        description: A pay config's ID. This endpoint will return a list of pay configs after this ID in relation to the API response order.
        examples:
          default:
            summary: default
            value: 01G0J1EXE7AXZ2C93K61WBPYEH
        in: query
        name: after
        schema:
          description: A pay config's ID. This endpoint will return a list of pay configs after this ID in relation to the API response order.
          example: 01G0J1EXE7AXZ2C93K61WBPYEH
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                pagination_meta:
                  after: 01FCNDV6P870EA6S7TK1DSYDG0
                  page_size: 25
                pay_configs:
                - base_rate_cents: 1200
                  created_at: '2021-08-17T13:28:57.801578Z'
                  currency: GBP
                  id: 01G0J1EXE7AXZ2C93K61WBPYEH
                  name: Engineering on-call
                  one_off_rules:
                  - end_at: '2021-08-17T13:28:57.801578Z'
                    id: 01G0J1EXE7AXZ2C93K61WBPYEH
                    name: Christmas day
                    rate_cents: 4800
                    start_at: '2021-08-17T13:28:57.801578Z'
                  published_at: '2021-08-17T13:28:57.801578Z'
                  rate_time_unit: hour
                  timezone: Europe/London
                  updated_at: '2021-08-17T13:28:57.801578Z'
                  weekly_rules:
                  - end_time: '17:00'
                    id: 01G0J1EXE7AXZ2C93K61WBPYEH
                    rate_cents: 2400
                    start_time: 09:00
                    weekdays:
                    - monday
              schema:
                $ref: '#/components/schemas/PayConfigsListResultV2'
          description: OK response.
        '400':
          content:

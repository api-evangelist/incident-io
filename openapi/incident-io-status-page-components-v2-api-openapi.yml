components:
  schemas:
    StatusPageComponentsUpdatePayloadV2:
      example:
        description: Our iOS app
        name: App
      properties:
        description:
          description: Optional short description of this component
          example: Our iOS app
          type: string
        name:
          description: Human-readable name for the component
          example: App
          type: string
      required:
      - name
      type: object
    ErrorRateLimit:
      example:
        limit: 100
        name: client_ip
        remaining: 98
        retry_after: '2020-01-01T00:00:00Z'
      properties:
        limit:
          description: The maximum number of requests that the consumer is permitted to make per minute
          example: 100
          format: int64
          type: integer
        name:
          description: Which rate limit was exceeded
          example: client_ip
          type: string
        remaining:
          description: The number of requests remaining in the current rate limit window
          example: 98
          format: int64
          type: integer
        retry_after:
          description: When the client can retry, as an RFC3339 timestamp in UTC. Prefer the Retry-After response header, which carries the same instant as a number of seconds
          example: '2020-01-01T00:00:00Z'
          type: string
      required:
      - name
      - limit
      - remaining
      - retry_after
      type: object
    StatusPageComponentsShowResultV2:
      example:
        status_page_component:
          description: Our iOS app
          id: 01FCNDV6P870EA6S7TK1DSYDG1
          management_meta:
            annotations:
              incident.io/terraform/version: 3.0.0
            managed_by: dashboard
            source_url: https://github.com/my-company/infrastructure
          name: App
      properties:
        status_page_component:
          $ref: '#/components/schemas/StatusPageComponentV2'
      required:
      - status_page_component
      type: object
    ErrorResponse:
      example:
        debug:
          message: 'Something broke: and something else: and something else'
          stacktrace:
          - thing.go:123
        errors:
        - code: trial_expired
          message: Default incident call link must be a valid URL
          metadata:
            abc123: abc123
          source:
            field: default_call_url
            pointer: /settings/default_call_url
        rate_limit:
          limit: 100
          name: client_ip
          remaining: 98
          retry_after: '2020-01-01T00:00:00Z'
        request_id: 2T1p0e3j
        status: 408
        type: invalid_request_error
      properties:
        debug:
          $ref: '#/components/schemas/ErrorDebug'
        errors:
          description: List of errors that caused this request to fail
          example:

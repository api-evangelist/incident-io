    ScheduleEntryV2:
      description: 'A single shift on a schedule, representing who is on-call between a start

        and end time. When present, `rotation_id` tells you which rotation the

        entry belongs to. A schedule may have multiple rotations (for example, a

        primary and a secondary rotation) and each rotation can be made up of several

        layers — entries are returned for every rotation and layer on the schedule.


        Entries come from two places: they are either generated from a schedule''s

        rotation configuration (the regular pattern of who is on-call) or created by

        an override (a one-off change that replaces the normal rotation for a period

        of time). When you call the List schedule entries endpoint we return both

        kinds separately, along with the merged `final` schedule that reflects what

        will actually happen.


        `entry_id` is only populated for entries that correspond to a stored

        record. Scheduled entries are projections computed from the rotation rules

        on the fly and don''t have a persisted ID, so `entry_id` will be absent for

        those. Use `fingerprint` if you need a stable identifier to deduplicate or

        diff a shift across requests.'
      example:
        end_at: '2021-08-17T13:28:57.801578Z'
        entry_id: 01G0J1EXE7AXZ2C93K61WBPYEH
        fingerprint: 01G0J1EXE7AXZ2C93K61WBPYEH
        rotation_id: 01G0J1EXE7AXZ2C93K61WBPYEH
        start_at: '2021-08-17T13:28:57.801578Z'
        user:
          email: lisa@incident.io
          id: 01FCNDV6P870EA6S7TK1DSYDG0
          name: Lisa Karlin Curtis
          role: owner
          slack_user_id: U02AYNF2XJM
      properties:
        end_at:
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        entry_id:
          description: Unique identifier of the schedule entry
          example: 01G0J1EXE7AXZ2C93K61WBPYEH
          type: string
        fingerprint:
          description: A unique identifier for this entry, used to determine a unique shift
          example: 01G0J1EXE7AXZ2C93K61WBPYEH
          type: string
        rotation_id:
          description: If present, the rotation this entry applies to on the schedule
          example: 01G0J1EXE7AXZ2C93K61WBPYEH
          type: string
        start_at:
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        user:
          $ref: '#/components/schemas/UserV2'
      required:
      - start_at
      - end_at
      type: object

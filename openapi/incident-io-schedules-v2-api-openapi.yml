    ScheduleSyncRuleV2:
      description: 'A sync rule links a schedule to a sync target, telling us which of the

        schedule''s members should flow into the target''s Slack user group.


        sync_type decides who is synced: on_call syncs only the people currently on

        call, next_on_call syncs the people on the next upcoming shift, and all_users

        syncs everyone on the schedule. By default every rotation on the schedule is

        included; set rotation_id to scope the rule to a single rotation. As the

        schedule''s shifts change hands, we keep the target''s Slack user group

        membership in step with the rule.


        A user group''s members are the union of every rule feeding it, so one schedule

        can have several rules for the same target as long as they differ on

        rotation_id or sync_type. Point an on_call and a next_on_call rule at one group

        and it holds both the current and the next on-call.


        permanent_member_user_ids names users who stay in the group whichever way the

        shifts fall, on top of whoever sync_type selects.'
      example:
        created_at: '2021-08-17T13:28:57.801578Z'
        id: 01JXYZ000000000000000000CD
        permanent_member_user_ids:
        - 01G0J1EXE7AXZ2C93K61WBPYEH
        rotation_id: 01JXYZ000000000000000000RT
        schedule_id: 01JXYZ000000000000000000EF
        schedule_sync_target:
          add_bot_to_group: true
          created_at: '2021-08-17T13:28:57.801578Z'
          id: 01JXYZ000000000000000000AB
          linked_schedules:
          - id: 01G0J1EXE7AXZ2C93K61WBPYEH
            name: Primary On-Call Schedule
            team_ids:
            - 01JPQA75EPNEES4479P16P4XAB
          slack_team_id: T02A1AZHG3J
          slack_user_group_id: S06MNNU5BMK
          updated_at: '2021-08-17T13:28:57.801578Z'
        schedule_sync_target_id: 01JXYZ000000000000000000AB
        sync_type: on_call
        updated_at: '2021-08-17T13:28:57.801578Z'
      properties:
        created_at:
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        id:
          description: Unique identifier of the sync rule
          example: 01JXYZ000000000000000000CD
          type: string
        permanent_member_user_ids:
          description: 'IDs of users always kept in the Slack user group, regardless of who is on call. Useful for keeping e.g. a manager in the group so they see mentions without being paged. Scoped to this rule: when several rules feed the same group, we sync the union of their permanent members.'
          example:
          - 01G0J1EXE7AXZ2C93K61WBPYEH
          items:
            example: abc123
            type: string
          type: array
        rotation_id:
          description: If set, only members of this rotation sync to the user group. When unset, all rotations on the schedule are synced.
          example: 01JXYZ000000000000000000RT
          type: string
        schedule_id:
          description: The schedule this rule belongs to

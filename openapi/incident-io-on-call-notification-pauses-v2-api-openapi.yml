tags:
- description: 'View on-call notification pauses: windows in which a user''s on-call notifications are paused, so escalations skip them instead of paging them.'
  name: On-call Notification Pauses V2
paths:
  /v2/on_call_notification_pauses:
    get:
      description: List on-call notification pauses across the organisation. By default this returns pauses that are active now or scheduled for the future. Cancelled pauses are never returned, and pauses that were resumed early have ends_at set to when they were resumed.
      operationId: On-callNotificationPausesV2#List
      parameters:
      - allowEmptyValue: true
        description: Only return pauses that end after this time. Defaults to now, so by default only active and upcoming pauses are returned.
        example: '2021-08-17T00:00:00Z'
        in: query
        name: from
        schema:
          description: Only return pauses that end after this time. Defaults to now, so by default only active and upcoming pauses are returned.
          example: '2021-08-17T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: true
        description: Only return pauses that start before this time
        example: '2021-08-24T00:00:00Z'
        in: query
        name: to
        schema:
          description: Only return pauses that start before this time
          example: '2021-08-24T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: true
        description: Integer number of records to return
        example: 25
        in: query
        name: page_size
        schema:
          default: 25
          description: Integer number of records to return
          example: 25
          format: int64
          maximum: 250
          minimum: 1
          type: integer
      - allowEmptyValue: true
        description: A pause's ID. This endpoint will return a list of pauses after this ID in relation to the API response order.
        examples:
          default:
            summary: default
            value: 01FCNDV6P870EA6S7TK1DSYDG0
        in: query
        name: after
        schema:
          description: A pause's ID. This endpoint will return a list of pauses after this ID in relation to the API response order.
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                on_call_notification_pauses:
                - created_at: '2021-08-17T13:28:57.801578Z'
                  ends_at: '2021-08-24T13:28:57.801578Z'
                  id: 01FCNDV6P870EA6S7TK1DSYDG0
                  reason: Annual leave
                  starts_at: '2021-08-17T13:28:57.801578Z'
                  updated_at: '2021-08-17T13:28:57.801578Z'
                  user_id: 01FCNDV6P870EA6S7TK1DSYDG0
                pagination_meta:
                  after: 01FCNDV6P870EA6S7TK1DSYDG0
                  page_size: 25
              schema:
                $ref: '#/components/schemas/OnCallNotificationPausesListResultV2'
          description: OK response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'invalid_request_error: There was a problem with the request, like a missing header or querying a resource that doesn''t exist.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'authentication_error: Authentication failed.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'resource_forbidden: Access to this resource is forbidden for the authenticated user.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'not_found: The referenced resource could not be found.'
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'method_not_allowed: The endpoint does not support this operation for the specified resource.'
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'not_acceptable: Requested a media type this endpoint does not support.'
        '408':

components:
  schemas:
    ErrorRateLimit:
      example:
        limit: 100
        name: client_ip
        remaining: 98
        retry_after: '2020-01-01T00:00:00Z'
      properties:
        limit:
          description: The maximum number of requests that the consumer is permitted to make per minute
          example: 100
          format: int64
          type: integer
        name:
          description: Which rate limit was exceeded
          example: client_ip
          type: string
        remaining:
          description: The number of requests remaining in the current rate limit window
          example: 98
          format: int64
          type: integer
        retry_after:
          description: When the client can retry, as an RFC3339 timestamp in UTC. Prefer the Retry-After response header, which carries the same instant as a number of seconds
          example: '2020-01-01T00:00:00Z'
          type: string
      required:
      - name
      - limit
      - remaining
      - retry_after
      type: object
    PaginationMetaResultV2:
      example:
        after: 01FCNDV6P870EA6S7TK1DSYDG0
        page_size: 25
      properties:
        after:
          description: If provided, pass this as the 'after' param to load the next page
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
        page_size:
          default: 25
          description: What was the maximum number of results requested
          example: 25
          format: int64
          maximum: 250
          type: integer
      required:
      - page_size
      type: object
    ErrorResponse:
      example:
        debug:
          message: 'Something broke: and something else: and something else'
          stacktrace:
          - thing.go:123
        errors:
        - code: trial_expired
          message: Default incident call link must be a valid URL
          metadata:
            abc123: abc123
          source:
            field: default_call_url
            pointer: /settings/default_call_url
        rate_limit:
          limit: 100
          name: client_ip
          remaining: 98
          retry_after: '2020-01-01T00:00:00Z'
        request_id: 2T1p0e3j
        status: 408
        type: invalid_request_error
      properties:
        debug:
          $ref: '#/components/schemas/ErrorDebug'
        errors:
          description: List of errors that caused this request to fail
          example:
          - code: trial_expired
            message: Default incident call link must be a valid URL
            metadata:
              abc123: abc123
            source:
              field: default_call_url
              pointer: /settings/default_call_url
          items:
            $ref: '#/components/schemas/ErrorSingle'
          type: array
        rate_limit:
          $ref: '#/components/schemas/ErrorRateLimit'
        request_id:
          description: Unique identifier of the request
          example: 2T1p0e3j
          type: string
        status:
          description: HTTP status of the response
          example: 408
          format: int64
          type: integer
        type:
          description: Machine-readable identifier for the general category of error
          enum:
          - invalid_request_error
          - authentication_error
          - resource_forbidden
          - not_found
          - not_acceptable
          - method_not_allowed
          - request_timeout
          - conflict
          - precondition_failed
          - payload_too_large
          - validation_error
          - too_many_requests
          - api_error
          - rate_limit_reached
          - client_timeout
          example: invalid_request_error
          type: string
      required:
      - type
      - status
      - request_id
      - errors
      type: object
    OnCallNotificationPauseV2:
      description: 'A window in which a user''s on-call notifications are paused: while it''s active, escalations skip the user instead of paging them.'
      example:
        created_at: '2021-08-17T13:28:57.801578Z'
        ends_at: '2021-08-24T13:28:57.801578Z'
        id: 01FCNDV6P870EA6S7TK1DSYDG0
        reason: Annual leave
        starts_at: '2021-08-17T13:28:57.801578Z'
        updated_at: '2021-08-17T13:28:57.801578Z'
        user_id: 01FCNDV6P870EA6S7TK1DSYDG0
      properties:
        created_at:
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        ends_at:
          description: When notifications resume
          example: '2021-08-24T13:28:57.801578Z'
          format: date-time
          type: string
        id:
          description: Unique identifier for this notification pause
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
        reason:
          description: Free text reason for why notifications are paused, shown to teammates
          example: Annual leave
          maxLength: 500
          type: string
        starts_at:
          description: When notifications stop being sent to the user
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        updated_at:
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        user_id:
          description: The user whose on-call notifications are paused in this time window
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
      required:
      - id
      - user_id
      - starts_at
      - ends_at
      - created_at
      - updated_at
      type: object
    ErrorDebug:
      example:
        message: 'Something broke: and something else: and something else'
        stacktrace:
        - thing.go:123
      properties:
        message:
          description: Original internal error message
          example: 'Something broke: and something else: and something else'
          type: string
        stacktrace:
          description: Stacktrace of the error, if applicable
          example:
          - thing.go:123
          items:
            example: thing.go:123
            type: string
          type: array
      required:
      - message
      - stacktrace
      type: object
    ErrorSource:
      example:
        field: default_call_url
        pointer: /settings/default_call_url
      properties:
        field:
          description: Field name that is the source of the error
          example: default_call_url
          type: string
        pointer:
          description: JSON pointer to the request field that is the source of the error
          example: /settings/default_call_url
          type: string
      required:
      - field
      - pointer
      type: object
    OnCallNotificationPausesListResultV2:
      example:
        on_call_notification_pauses:
        - created_at: '2021-08-17T13:28:57.801578Z'
          ends_at: '2021-08-24T13:28:57.801578Z'
          id: 01FCNDV6P870EA6S7TK1DSYDG0
          reason: Annual leave
          starts_at: '2021-08-17T13:28:57.801578Z'
          updated_at: '2021-08-17T13:28:57.801578Z'
          user_id: 01FCNDV6P870EA6S7TK1DSYDG0
        pagination_meta:
          after: 01FCNDV6P870EA6S7TK1DSYDG0
          page_size: 25
      properties:
        on_call_notification_pauses:
          description: Pauses ordered by when they start
          example:
          - created_at: '2021-08-17T13:28:57.801578Z'
            ends_at: '2021-08-24T13:28:57.801578Z'
            id: 01FCNDV6P870EA6S7TK1DSYDG0
            reason: Annual leave
            starts_at: '2021-08-17T13:28:57.801578Z'
            updated_at: '2021-08-17T13:28:57.801578Z'
            user_id: 01FCNDV6P870EA6S7TK1DSYDG0
          items:
            $ref: '#/components/schemas/OnCallNotificationPauseV2'
          type: array
        pagination_meta:
          $ref: '#/components/schemas/PaginationMetaResultV2'
      required:
      - on_call_notification_pauses
      - pagination_meta
      type: object
    OnCallNotificationPausesShowResultV2:
      example:
        on_call_notification_pause:
          created_at: '2021-08-17T13:28:57.801578Z'
          ends_at: '2021-08-24T13:28:57.801578Z'
          id: 01FCNDV6P870EA6S7TK1DSYDG0
          reason: Annual leave
          starts_at: '2021-08-17T13:28:57.801578Z'
          updated_at: '2021-08-17T13:28:57.801578Z'
          user_id: 01FCNDV6P870EA6S7TK1DSYDG0
      properties:
        on_call_notification_pause:
          $ref: '#/components/schemas/OnCallNotificationPauseV2'
      required:
      - on_call_notification_pause
      type: object
    ErrorSingle:
      example:
        code: trial_expired
        message: Default incident call link must be a valid URL
        metadata:
          abc123: abc123
        source:
          field: default_call_url
          pointer: /settings/default_call_url
      properties:
        code:
          description: Machine-readable identifier for this specific error
          example: trial_expired
          type: string
        message:
          description: Human readable description of the error
          example: Default incident call link must be a valid URL
          type: string
        metadata:
          additionalProperties:
            example: abc123
            type: string
          description: Additional metadata about the error, keyed by a string identifier
          example:
            abc123: abc123
          type: object
        source:
          $ref: '#/components/schemas/ErrorSource'
      required:
      - code
      - message
      type: object

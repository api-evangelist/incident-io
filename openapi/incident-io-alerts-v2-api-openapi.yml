            - '2025-01-01'
          type: object
        style: deepObject
      - allowEmptyValue: true
        description: Filter on alert updated at timestamp. Accepted operators are 'gte', 'lte' and 'date_range'.
        example:
          gte:
          - '2025-01-01'
        explode: true
        in: query
        name: updated_at
        schema:
          additionalProperties:
            example:
            - some_value
            items:
              example: some_value
              type: string
            type: array
          description: Filter on alert updated at timestamp. Accepted operators are 'gte', 'lte' and 'date_range'.
          example:
            gte:
            - '2025-01-01'
          type: object
        style: deepObject
      - allowEmptyValue: true
        description: Filter on an alerts attributes. Alert attribute ID should be sent, followed by the operator and values. Accepted operator will depend on the attribute type.
        example:
          01GBSQF3FHF7FWZQNWGHAVQ804:
            one_of:
            - 01GBSQF3FHF7FWZQNWGHAVQ804
            - 01ET65M7ZARSFZ6TFDFVQDN9AA
        explode: true
        in: query
        name: attributes
        schema:
          additionalProperties:
            additionalProperties:
              example:
              - value
              items:
                example: value
                type: string
              type: array
            example:
              abc123:
              - value
            type: object
          description: Filter on an alerts attributes. Alert attribute ID should be sent, followed by the operator and values. Accepted operator will depend on the attribute type.
          example:
            01GBSQF3FHF7FWZQNWGHAVQ804:
              one_of:
              - 01GBSQF3FHF7FWZQNWGHAVQ804
              - 01ET65M7ZARSFZ6TFDFVQDN9AA
          type: object
        style: deepObject
      - allowEmptyValue: true
        description: Filter on whether an alert has notes. The accepted operator is 'is'.
        example:
          is:
          - 'true'
        explode: true
        in: query
        name: has_notes
        schema:
          additionalProperties:
            example:
            - some_value
            items:
              example: some_value
              type: string
            type: array
          description: Filter on whether an alert has notes. The accepted operator is 'is'.
          example:
            is:
            - 'true'
          type: object
        style: deepObject
      - allowEmptyValue: true
        description: Filter on the tags applied to an alert, by tag name. The accepted operators are 'one_of', 'all_of' and 'not_in'.
        example:
          one_of:
          - known issue
        explode: true
        in: query
        name: tags
        schema:
          additionalProperties:
            example:

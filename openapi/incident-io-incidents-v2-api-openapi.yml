tags:
- description: 'Create and read incidents.


    Incidents are a core resource, on which many other resources (actions, etc) are created.


    Care should be taken around these endpoints, as automation that creates duplicate

    incidents can be distracting, and impact reporting.'
  name: Incidents V2
paths:
  /v2/incidents:
    get:
      description: 'List all incidents for an organisation. This endpoint supports a number of filters, which can help find incidents matching certain

        criteria. Filters are provided as query parameters, but due to the dynamic nature of what you can

        query by (different accounts have different custom fields, statuses, etc) they are more

        complex than most. The maximum page size that can be requested is 250. To help, here are some exemplar curl requests with a human description of what they search

        for. Note that:

        - Filters may be combined using the filter_mode parameter: ''all'' (default) requires all filters

        to match (AND logic), while ''any'' requires at least one filter to match (OR logic). - IDs are normally in UUID format, but have been replaced with shorter strings to improve

        readability. - All query parameters must be URI encoded. ### By status


        With status of id=ABC, find all incidents that are set to that status:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''status[one_of]=ABC''


        Or all incidents that are not set to status with id=ABC:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''status[not_in]=ABC''


        ### By created_at or updated_at


        Find all incidents that follow specified date parameters for created_at and updated_at fields. Possible values are "gte" (greater than or equal to), "lte" (less than or equal to), and

        "date_range" (between two dates). The following example finds all incidents created before

        or on 2021-01-02T00:00:00Z:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''created_at[lte]=2021-01-02''


        To find incidents created within a specific date range, use the date_range option with

        tilde-separated dates:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''created_at[date_range]=2024-12-02~2024-12-08''


        ### By status category


        Find all incidents that are in a status category. Some categories use a different

        name in the API than the one shown in the dashboard — most notably "live" (shown as

        "Active") and "learning" (shown as "Post-incident"). The full mapping is:


        | API value | Shown in app as |

        | ---------- | --------------- |

        | triage | Triage |

        | live | Active |

        | learning | Post-incident |

        | paused | Paused |

        | closed | Closed |

        | declined | Declined |

        | canceled | Canceled |

        | merged | Merged |


        For example, to find all incidents the dashboard shows as "Active", filter on the

        "live" category:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''status_category[one_of]=live''


        Or all incidents that are not in a status category:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''status_category[not_in]=live''


        ### By severity


        With severity of id=ABC, find all incidents that are set to that severity:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''severity[one_of]=ABC''


        Or all incidents where severity rank is greater-than-or-equal-to the rank of severity

        id=ABC:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''severity[gte]=ABC''


        Or all incidents where severity rank is less-than-or-equal-to the rank of severity id=ABC:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''severity[lte]=ABC''


        ### By incident type


        With incident type of id=ABC, find all incidents that are of that type:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''incident_type[one_of]=ABC''


        Or all incidents not of that type:


        curl --get ''https://api.incident.io/v2/incidents'' \

        --data ''incident_type[not_in]=ABC''


        ### By incident mode


        By default, we return standard and retrospective incidents. This means that test and

        tutorial incidents are filtered out. To override this behaviour, you can use the

        mode filter to specify which modes you want to get.'
      operationId: IncidentsV2#List
      parameters:
      - allowEmptyValue: true
        description: Integer number of records to return
        example: 25
        in: query
        name: page_size
        schema:
          default: 25
          description: Integer number of records to return
          example: 25
          format: int64
          maximum: 500
          minimum: 1
          type: integer
      - allowEmptyValue: true
        description: An incident's ID. This endpoint will return a list of incidents after this ID in relation to the API response order.
        examples:
          default:
            summary: default
            value: 01FDAG4SAP5TYPT98WGR2N7W91
        in: query
        name: after
        schema:
          description: An incident's ID. This endpoint will return a list of incidents after this ID in relation to the API response order.
          example: 01FDAG4SAP5TYPT98WGR2N7W91
          type: string
      - allowEmptyValue: true
        description: What order to return results in.
        example: created_at_newest_first
        in: query
        name: sort_by
        schema:
          default: created_at_newest_first
          description: What order to return results in.
          enum:
          - created_at_newest_first
          - created_at_oldest_first
          example: created_at_newest_first
          type: string
      - allowEmptyValue: true
        description: 'How to combine the filters: ''all'' combines them with AND logic (all must match), ''any'' combines them with OR logic (any can match). Defaults to ''all''.'
        example: all
        in: query
        name: filter_mode
        schema:

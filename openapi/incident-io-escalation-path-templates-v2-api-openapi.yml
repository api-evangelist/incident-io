          repeat_times: 3
          to_node: 01FCNDV6P870EA6S7TK1DSYDG0
        type: if_else
      properties:
        delay:
          $ref: '#/components/schemas/EscalationPathNodeDelayV2'
        escalation_path:
          $ref: '#/components/schemas/EscalationPathNodeEscalationPathV2'
        id:
          description: 'An ID for this node, unique within the escalation path.


            This allows you to reference the node in other nodes, such as when configuring a ''repeat'' node.'

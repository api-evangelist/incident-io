          example: oncall-plugins
          type: string
        after_repo_owner:
          description: The owner of the plugin's new repository
          example: acme-forks
          type: string
        after_skill_selection_mode:
          description: 'Which skills load after the change: every skill, or only the selected ones (automatic, selected)'

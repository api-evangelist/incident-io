          example: '{"read":{"enabled":true,"surfaces":{"chat":{"type":"deny"}}}}'
          type: string
        before:
          description: The policy before the change, as JSON; empty when the connector had no access policy
          example: '{"read":{"enabled":true,"surfaces":{"chat":{"type":"allow"}}}}'
          type: string
        change_id:
          description: Shared by every entry the same save produced, so the decision that changed and the access it reached can be read together
          example: 01JD8ZQK9X0000000000000000
          type: string
        notification_channels_after:
          description: The default notification channels after the change, as JSON; absent when they did not change, empty when there are none
          example: ''
          type: string
        notification_channels_before:
          description: The default notification channels before the change, as JSON; absent when they did not change, empty when there were none
          example: '{"slack_channels":{"array_value":[{"literal":"C0123456789"}]}}'
          type: string
        set_by:
          description: ID of the user who saved the policy, absent when staff tooling saved it
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
      required:
      - before
      - after
      - change_id
      type: object

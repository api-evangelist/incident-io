        before_skill_selection_mode:
          description: 'Which skills loaded before the change: every skill, or only the selected ones (automatic, selected)'
          example: automatic
          type: string
        before_subpath:
          description: The plugin's previous directory within its repository, absent when it was the repository root
          example: plugins/acme-oncall
          type: string
        changed:

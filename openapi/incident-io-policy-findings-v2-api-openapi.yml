  /v2/policy_findings/{id}/actions/dismiss:
    post:
      description: 'Dismiss a finding, so it stops being counted as open.


        Dismissing is a judgement that the finding doesn''t need acting on, not that the

        resource now meets the policy. The finding stays queryable with a state of

        dismissed.'
      operationId: PolicyFindingsV2#Dismiss
      parameters:
      - description: Unique identifier for the finding
        example: 01FCNDV6P870EA6S7TK1DSYDG0
        in: path
        name: id
        required: true
        schema:
          description: Unique identifier for the finding
          example: 01FCNDV6P870EA6S7TK1DSYDG0
          type: string
      requestBody:
        content:
          application/json:
            example:
              reason: This incident is special.

        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'api_error: Something went wrong and has been reported internally.'
      summary: ShowIPAllowlist IPAllowlists V1
      tags:
      - IPAllowlists V1
      x-docs-display-name: Show
      x-docs-group-name: IPAllowlists V1
      x-docs-resource-type: IPAllowlistV1
      x-operation-id-source: normalized
      x-operation-id-original: IPAllowlists V1#ShowIPAllowlist
    put:
      description: Update the IP allowlist for your organisation
      operationId: IPAllowlistsV1#UpdateIPAllowlist
      requestBody:
        content:
          application/json:
            example:
              allowlist:
              - label: London HQ
                value: 192.0.2.0
              enabled: true

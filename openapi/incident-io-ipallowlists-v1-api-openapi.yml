components:
  schemas:
    ErrorRateLimit:
      example:
        limit: 100
        name: client_ip
        remaining: 98
        retry_after: '2020-01-01T00:00:00Z'
      properties:
        limit:
          description: The maximum number of requests that the consumer is permitted to make per minute
          example: 100
          format: int64
          type: integer
        name:
          description: Which rate limit was exceeded
          example: client_ip
          type: string
        remaining:
          description: The number of requests remaining in the current rate limit window
          example: 98
          format: int64
          type: integer
        retry_after:
          description: When the client can retry, as an RFC3339 timestamp in UTC. Prefer the Retry-After response header, which carries the same instant as a number of seconds
          example: '2020-01-01T00:00:00Z'
          type: string
      required:
      - name
      - limit
      - remaining
      - retry_after
      type: object
    IPAllowlistsShowIPAllowlistResultV1:
      example:
        ip_allowlist:
          allowlist:
          - label: London HQ
            value: 192.0.2.0
          enabled: true
          updated_at: '2021-08-17T13:28:57.801578Z'
          version: 1
      properties:
        ip_allowlist:
          $ref: '#/components/schemas/IPAllowlistV1'
      required:
      - ip_allowlist
      type: object
    IPAllowlistsUpdateIPAllowlistPayloadV1:
      example:
        allowlist:
        - label: London HQ
          value: 192.0.2.0
        enabled: true
        version: 1
      properties:
        allowlist:
          description: A list of IP addresses or CIDR prefixes to allow
          example:
          - label: London HQ
            value: 192.0.2.0
          items:
            $ref: '#/components/schemas/IPAllowlistItemV1'
          type: array
        enabled:
          description: Whether this IP allowlist is enabled or not
          example: true
          type: boolean
        version:
          description: The version of this IP allowlist
          example: 1
          format: int64
          type: integer
      required:
      - version
      - enabled
      - allowlist
      type: object
    ErrorResponse:
      example:
        debug:
          message: 'Something broke: and something else: and something else'
          stacktrace:
          - thing.go:123
        errors:
        - code: trial_expired
          message: Default incident call link must be a valid URL
          metadata:
            abc123: abc123
          source:
            field: default_call_url
            pointer: /settings/default_call_url
        rate_limit:
          limit: 100
          name: client_ip
          remaining: 98
          retry_after: '2020-01-01T00:00:00Z'
        request_id: 2T1p0e3j
        status: 408
        type: invalid_request_error
      properties:
        debug:
          $ref: '#/components/schemas/ErrorDebug'
        errors:
          description: List of errors that caused this request to fail
          example:
          - code: trial_expired
            message: Default incident call link must be a valid URL
            metadata:
              abc123: abc123
            source:
              field: default_call_url
              pointer: /settings/default_call_url
          items:
            $ref: '#/components/schemas/ErrorSingle'
          type: array
        rate_limit:
          $ref: '#/components/schemas/ErrorRateLimit'
        request_id:
          description: Unique identifier of the request
          example: 2T1p0e3j
          type: string
        status:
          description: HTTP status of the response
          example: 408
          format: int64
          type: integer
        type:
          description: Machine-readable identifier for the general category of error
          enum:
          - invalid_request_error
          - authentication_error
          - resource_forbidden
          - not_found
          - not_acceptable
          - method_not_allowed
          - request_timeout
          - conflict
          - precondition_failed
          - payload_too_large
          - validation_error
          - too_many_requests
          - api_error
          - rate_limit_reached
          - client_timeout
          example: invalid_request_error
          type: string
      required:
      - type
      - status
      - request_id
      - errors
      type: object
    IPAllowlistsUpdateIPAllowlistResultV1:
      example:
        ip_allowlist:
          allowlist:
          - label: London HQ
            value: 192.0.2.0
          enabled: true
          updated_at: '2021-08-17T13:28:57.801578Z'
          version: 1
      properties:
        ip_allowlist:
          $ref: '#/components/schemas/IPAllowlistV1'
      required:
      - ip_allowlist
      type: object
    ErrorDebug:
      example:
        message: 'Something broke: and something else: and something else'
        stacktrace:
        - thing.go:123
      properties:
        message:
          description: Original internal error message
          example: 'Something broke: and something else: and something else'
          type: string
        stacktrace:
          description: Stacktrace of the error, if applicable
          example:
          - thing.go:123
          items:
            example: thing.go:123
            type: string
          type: array
      required:
      - message
      - stacktrace
      type: object
    IPAllowlistV1:
      example:
        allowlist:
        - label: London HQ
          value: 192.0.2.0
        enabled: true
        updated_at: '2021-08-17T13:28:57.801578Z'
        version: 1
      properties:
        allowlist:
          description: A list of IP addresses or CIDR prefixes to allow
          example:
          - label: London HQ
            value: 192.0.2.0
          items:
            $ref: '#/components/schemas/IPAllowlistItemV1'
          type: array
        enabled:
          description: Whether this IP allowlist is enabled or not
          example: true
          type: boolean
        updated_at:
          description: The time this allowlist was last updated
          example: '2021-08-17T13:28:57.801578Z'
          format: date-time
          type: string
        version:
          description: The version of this IP allowlist
          example: 1
          format: int64
          type: integer
      required:
      - version
      - enabled
      - allowlist
      type: object
    ErrorSource:
      example:
        field: default_call_url
        pointer: /settings/default_call_url
      properties:
        field:
          description: Field name that is the source of the error
          example: default_call_url
          type: string
        pointer:
          description: JSON pointer to the request field that is the source of the error
          example: /settings/default_call_url
          type: string
      required:
      - field
      - pointer
      type: object
    IPAllowlistItemV1:
      example:
        label: London HQ
        value: 192.0.2.0
      properties:
        label:
          description: A label to help identify this IP or prefix
          example: London HQ
          type: string
        value:
          description: An IP address or a CIDR IP prefix to allow
          example: 192.0.2.0
          type: string
      required:
      - value
      type: object
    ErrorSingle:
      example:
        code: trial_expired
        message: Default incident call link must be a valid URL
        metadata:
          abc123: abc123
        source:
          field: default_call_url
          pointer: /settings/default_call_url
      properties:
        code:
          description: Machine-readable identifier for this specific error
          example: trial_expired
          type: string
        message:
          description: Human readable description of the error
          example: Default incident call link must be a valid URL
          type: string
        metadata:
          additionalProperties:
            example: abc123
            type: string
          description: Additional metadata about the error, keyed by a string identifier
          example:
            abc123: abc123
          type: object
        source:
          $ref: '#/components/schemas/ErrorSource'
      required:
      - code
      - message
      type: object
  securitySchemes:
    BearerAuth:
      description: API key from your incident.io dashboard (Settings > API keys)
      scheme: bearer
      type: http

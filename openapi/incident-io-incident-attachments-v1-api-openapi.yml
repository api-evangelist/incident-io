      description: 'Attaches an external resource to an incident.


        You must provide a resource with resource_type and either external_id or url, but not both.


        When providing a url, the server will create the attachment from that link for the given resource type if the integration is installed and the link is valid.


        To attach an arbitrary link that isn''t backed by an integration, use the arbitrary_url resource type with a url, and optionally a title and emoji.'
      operationId: IncidentAttachmentsV1#Create
      requestBody:
        content:
          application/json:
            example:
              incident_id: 01FCNDV6P870EA6S7TK1DSYD5H
              resource:
                emoji: rocket
                external_id: '123'
                resource_type: pager_duty_incident
                title: Impact tracking spreadsheet
                url: https://github.com/company/repo/pull/123
            schema:
              $ref: '#/components/schemas/IncidentAttachmentsCreatePayloadV1'
        required: true
      responses:

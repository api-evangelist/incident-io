    \ and 'dashboard'. We also removed\nthe usage of some types that were deprecated in the V2 API. \n\
    \nUse the incident.io catalog to track services, teams, product features and anything\nelse that helps\
    \ build a map of your organisation. These different categories of thing\nbecome catalog types, and\
    \ each instance (like a particular service or team) is a\ncatalog entry.\n\nEach type is made up of\
    \ a series of attributes, and each attribute has a type. Types\ncan even have attributes that refer\
    \ to other catalog types.\n\nWe automatically create catalog types when you connect an integration,\
    \ such as GitHub\nrepositories or PagerDuty services and teams. You can use this API to create custom\n\
    types, that are specifically tailored to your organisation.\n\nExamples might be a 'Service' type\
    \ with an 'Alert channel' which you can point at a\nSlack channel, or 'Team' which specifies its 'Manager'\
    \ and 'Technical Lead' as Slack\nusers. You can then use these types to create powerful new workflows.\n\
    \nConsider using our official [catalog importer](https://github.com/incident-io/catalog-importer).\n\
    It can be used to sync catalog data from sources like local files or GitHub and push\nthem into the\
    \ incident.io catalog without having to directly interact with our public API."

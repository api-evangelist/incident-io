- aid: incident-io:incident-io-api-keys-v1-api
  name: Incident.io API Keys V1 API
  description: >-
    Manage API keys for your organization.


    This API lets you view, create, update, delete, and rotate API keys programmatically, including configuring
    account-level roles and roles scoped to specific teams.


    Common use cases include:

    - **API key rotation**: You can issue a new access token for any API key using the `Rotate` endpoint.

    - **Managing keys at scale**: use the `Show`, `List`, `Create`, `Update`, and `Delete` endpoints to
    automate API key lifecycle management.


    ## Permissions model


    To use these endpoints, your API key must have the `api_keys_manage` role granted at either the account
    level or for specific teams.


    In addition, the following rules apply, when a "caller" API key is managing a "target" API key:


    - A caller key can only assign roles whose scopes are a subset of its own scopes. For example, a key
    with `viewer` and `incident_creator` can assign those roles to a target key, but cannot assign the
    `incident_editor` role, since it has additional scopes.

    - The same applies at the team level: A caller key with `schedules_editor` at the account level can
    create a target key with that role for a specific team, but a key with `schedules_editor` only for
    one team (Team A, say) cannot assign it at the account level or for another team, Team B.

    - The `api_keys_manage` role cannot be assigned via the API. To create a key with that role, you must
    go to Settings → API keys in the dashboard, and click "Add new", creating a key with the "View, create,
    edit, delete or rotate API keys" role (`api_keys_manage`).

    - The `Delete` endpoint does not check whether the calling API key holds the scopes of the key being
    deleted. However, a team-scoped key can only delete keys belonging to its teams.

    - To rotate the token of an API key, use the Rotate endpoint or by clicking "Rotate token" on any
    API key listed in the dashboard. The same permissions limitations apply as when creating or updating
    an API key.


    ## Finding role names and team IDs


    To find valid values for `role_names`, `team_ids`, and `team_role_names`, go to Settings → API keys
    in the dashboard. Click to either edit an existing key or create a new one, select the desired roles
    and teams, and then use the copy button to get hold of the role and team identifiers as JSON.
  humanURL: https://incident.io
  tags:
  - API Keys V1
  properties:
  - type: OpenAPI
    url: openapi/incident-io-api-keys-v1-api-openapi.yml
- aid: incident-io:incident-io-audit-logs-api
  name: Incident.io Audit logs API
  description: >-
    To give you visibility over the changes that are made within your incident.io account, we use an audit
    log. Our audit log is powered by <a href="https://workos.com" target="_blank">WorkOS</a>. The log
    is available for customers on our [Enterprise plan](https://incident.io/pricing).


    The audit log contains information about any configuration changes, as well as changes to a user's
    permissions (e.g. being given a new role, or access to a private incident).


    Each entry will have an actor (the person or system that made the change) and one or more targets
    (a thing that was modified by this change). It will also include the Location and User Agent of the
    actor, where applicable.


    Each entry will conform to a schema, which is documented here. Each entry also has a version, so that
    if our schema changes over time you’ll still be able to parse old events.


    We’ll retain these entries for one year.


    Audit log entries start from 18 April, 2023 (there are no entries available from before that date)
    and are retained in WorkOS for 365 days.


    ## Viewing your audit log


    You can view your audit log via our [security settings](https://app.incident.io/settings/security)
    page.


    From there, you'll be able to:


    - View the entries via a web interface (filterable by target, event type, actor and date)

    - Export the entries for a given time period to a CSV

    - Set up a log stream to a provider of your choice (e.g. Splunk or an Amazon S3 bucket)


    ## Understanding actors


    Each entry will have an actor associated with it, which is one of 6 types:


    ### Users


    This is for changes triggered by the actions of a particular user in your account.


    As an example:


    ```

    "actor": {
        "type": "user",
        "id": "01G0J1EXE7AXZ2C93K61WBPYEH",
        "name": "Kelsey Mills",
        "metadata": {
          "user_base_role_slug": "admin",
          "user_custom_role_slugs": "engineering,security"
        }
      }
    ```


    ### API Keys


    This is for changes triggered by an API key.


    As an example:


    ```

    "actor": {
        "type": "api_key",
        "id": "01G0J1EXE7AXZ2C93K61WBPYEH",
        "name": "Lisa's development key",
        "metadata": {
          "api_key_roles": "incident_creator,global_access"
        }
      }
    ```


    ### Integrations


    This is for changes triggered by a system. Sometimes that will be a third party system (e.g. a user
    might be created

    via Slack) or sometimes it might be something triggered from inside incident.io (e.g. a severity created
    as part of setup).


    As an example:


    ```

    "actor": {
        "type": "system",
        "id": "incident_setup",
        "name": "incident.io (setup)",
        "metadata": {}
      }
    ```


    ### Workflows


    This is for changes triggered by a workflow: for example, a workflow that invites users to a private
    incident.


    As an example:


    ```

    "actor": {
        "type": "workflow",
        "id": "01G0J1EXE7AXZ2C93K61WBPYEH",
        "name": "Auto-invite security team to private incidents",
        "metadata": {}
      }
    ```


    ### External resources


    This is for changes triggered by a specific [external resource](https://api-docs.incident.io/tag/Incident-Attachments-V1)
    (also known as an attachment).


    As an example:


    ```

    "actor": {
        "type": "external_resource",
        "id": "01G0J1EXE7AXZ2C93K61WBPYEH",
        "name": "#1234 Increased API latency",
        "metadata": {
          "external_resource_type": "pager_duty_incident",
          "external_resource_external_id": "q1234"
        }
      }
    ```


    ### Alerts


    This is for changes triggered by a specific alert (e.g. from Datadog or Grafana).


    As an example:


    ```

    "actor": {
        "type": "alert",
        "id": "01G0J1EXE7AXZ2C93K61WBPYEH",
        "name": "Staging: pod CPU high",
        "metadata": {
          "alert_source_id": "01HB0ZG3B0HM04RCXNSPV1EDYG"
        }
      }
    ```

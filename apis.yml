  name: Incident.io Actions V1 API
  description: "Manage incident actions.\n\nThese endpoints have been deprecated in favour of Actions\
    \ V2 and Follow-ups V2, as these\nconcepts have become increasingly separate.\n\nIncidents have two\
    \ types of actions associated to them:\n\n- Actions, used during an incident response as ephemeral\
    \ todo lists\n- Follow-ups, actions which are for after the incident and can be exported to external\n\
    \tissue trackers\n\nYou can manage actions in the incident Slack channel with <code>/incident actions</code>,\
    \ or on\nthe incident homepage.\n\nExporting follow-ups to external issue trackers can be done in\
    \ the incident homepage."
  humanURL: https://incident.io
  tags:
  - Actions V1
  properties:
  - type: OpenAPI
    url: openapi/incident-io-actions-v1-api-openapi.yml
- aid: incident-io:incident-io-actions-v2-api
  name: Incident.io Actions V2 API
  description: >-
    Manage incident actions.


    These endpoints have been deprecated in favour of Actions V3, which returns the same

    action payload, and will be removed on 31 December 2026. The V3 List endpoint is paginated

    and supports filtering by created_at and updated_at, so use it instead of re-fetching the

    full list.


    Incident actions are used during an incident, to track work such as 'restart the database' or 'contact
    the customer'.


    You can manage actions in the incident Slack channel with <code>/incident actions</code>, or on

    the incident homepage.
